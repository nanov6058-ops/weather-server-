<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Метео-Карта — Weather App</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a1a; overflow: hidden; height: 100%; width: 100%; }
        #map { width: 100vw; height: 100vh; background: #0a0a1a; transition: filter 1.5s ease; }
        body.chernobyl #map { filter: sepia(1) hue-rotate(60deg) saturate(2) brightness(0.7) contrast(1.3); }
        body.chernobyl::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, rgba(0, 255, 0, 0.08) 0%, transparent 60%); pointer-events: none; z-index: 900; animation: chernobylPulse 4s infinite; }
        @keyframes chernobylPulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.7; } }
        body.chernobyl::after { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.03) 0px, rgba(0, 255, 0, 0.03) 1px, transparent 1px, transparent 3px); pointer-events: none; z-index: 901; animation: scanlines 8s linear infinite; }
        @keyframes scanlines { 0% { background-position: 0 0; } 100% { background-position: 0 100px; } }

        .top-bar { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; gap: 8px; z-index: 1000; pointer-events: none; }
        .search-box { display: flex; align-items: center; gap: 6px; background: rgba(15, 15, 30, 0.95); border-radius: 25px; padding: 6px 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid rgba(100,150,255,0.2); pointer-events: all; flex: 1; max-width: 320px; }
        body.chernobyl .search-box { border-color: #00ff00; box-shadow: 0 0 20px rgba(0,255,0,0.3); }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; min-width: 0; }
        .search-box input::placeholder { color: #888; }
        .search-box button { background: transparent; border: none; color: #6eb5ff; font-size: 18px; cursor: pointer; padding: 0 4px; }
        body.chernobyl .search-box button { color: #00ff00; }

        .logo-badge { display: flex; align-items: center; gap: 6px; background: rgba(15, 15, 30, 0.95); border-radius: 25px; padding: 6px 14px; color: #fff; font-weight: bold; font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); pointer-events: all; border: 1px solid rgba(100,150,255,0.2); white-space: nowrap; }
        .logo-badge span { color: #ff6b6b; }
        body.chernobyl .logo-badge { border-color: #00ff00; }
        body.chernobyl .logo-badge span { color: #00ff00; }

        .user-area { margin-left: auto; display: flex; gap: 8px; pointer-events: all; }
        .user-btn { background: rgba(15, 15, 30, 0.95); border-radius: 25px; padding: 6px 14px; color: #fff; font-size: 13px; font-weight: bold; border: 1px solid rgba(100,150,255,0.2); cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.5); white-space: nowrap; }
        .user-btn:hover { background: rgba(30, 30, 60, 0.95); }
        .user-btn.admin-btn { border-color: #ff6b6b; color: #ff6b6b; }

        .layers-menu { position: fixed; top: 65px; right: 10px; background: rgba(15, 15, 30, 0.95); border-radius: 15px; padding: 8px; z-index: 1000; width: 68px; box-shadow: 0 4px 30px rgba(0,0,0,0.6); border: 1px solid rgba(100,150,255,0.2); display: flex; flex-direction: column; gap: 5px; }
        body.chernobyl .layers-menu { border-color: #00ff00; }
        .layer-item { display: flex; flex-direction: column; align-items: center; padding: 5px 3px; border-radius: 10px; cursor: pointer; transition: background 0.2s; color: #fff; }
        .layer-item:hover { background: rgba(110, 181, 255, 0.2); }
        body.chernobyl .layer-item:hover { background: rgba(0, 255, 0, 0.2); }
        .layer-item.active { background: rgba(110, 181, 255, 0.35); }
        body.chernobyl .layer-item.active { background: rgba(0, 255, 0, 0.3); }
        .layer-item .icon { font-size: 20px; margin-bottom: 1px; }
        .layer-item .label { font-size: 8px; text-align: center; color: #ccc; line-height: 1.1; }

        .weather-panel { position: fixed; top: 65px; left: 10px; background: rgba(15, 15, 30, 0.95); border-radius: 15px; padding: 15px; z-index: 1000; width: 240px; box-shadow: 0 4px 30px rgba(0,0,0,0.6); border: 1px solid rgba(100,150,255,0.2); color: #fff; }
        body.chernobyl .weather-panel { border-color: #00ff00; }
        .weather-panel h2 { font-size: 14px; color: #6eb5ff; margin-bottom: 10px; }
        body.chernobyl .weather-panel h2 { color: #00ff00; }
        .weather-panel .city { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
        .weather-panel .temp-big { font-size: 38px; font-weight: bold; color: #fff; margin: 5px 0; }
        body.chernobyl .weather-panel .temp-big { color: #00ff00; text-shadow: 0 0 15px rgba(0,255,0,0.7); }
        .weather-panel .desc { color: #aaa; font-size: 12px; margin-bottom: 10px; }
        .weather-panel .details { font-size: 12px; }
        .weather-panel .details div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .weather-panel .details div:last-child { border-bottom: none; }
        .weather-panel .details .val { color: #6eb5ff; font-weight: bold; }
        body.chernobyl .weather-panel .details .val { color: #00ff00; }

        .intensity-bar { width: 100%; height: 12px; background: linear-gradient(to right, #00ff00 0%, #88ff00 25%, #ffff00 50%, #ff8800 75%, #ff0000 100%); border-radius: 6px; margin: 6px 0; position: relative; overflow: hidden; }
        .intensity-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: rgba(255, 255, 255, 0.3); border-right: 3px solid #fff; transition: width 0.2s ease; }
        .intensity-scale { display: flex; justify-content: space-between; font-size: 9px; color: #888; margin-top: 4px; }
        .intensity-value { text-align: center; font-size: 12px; color: #fff; font-weight: bold; margin-top: 6px; padding: 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.3); }

        .admin-panel { position: fixed; top: 0; right: 0; height: 100vh; width: 340px; max-width: 95vw; background: rgba(5, 5, 15, 0.98); padding: 20px 18px; color: #fff; z-index: 2000; box-shadow: -10px 0 40px rgba(0,0,0,0.8); border-left: 2px solid #ff6b6b; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; display: none; }
        .admin-panel.allowed { display: block; }
        .admin-panel.active { transform: translateX(0); }
        .admin-panel h2 { margin-bottom: 18px; font-size: 18px; color: #ff6b6b; border-bottom: 2px solid #ff6b6b; padding-bottom: 12px; }
        .admin-section { margin-bottom: 16px; }
        .admin-section h3 { font-size: 13px; color: #6eb5ff; margin-bottom: 8px; }
        .admin-control { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .admin-control label { font-size: 12px; color: #aaa; }
        .admin-control input[type="range"] { width: 100%; height: 6px; }
        .admin-control input[type="text"] { padding: 10px; border-radius: 8px; background: #1a1a3e; color: #fff; border: 1px solid #444; font-size: 13px; }
        .admin-control select { padding: 10px; border-radius: 8px; background: #1a1a3e; color: #fff; border: 1px solid #444; font-size: 13px; }

        .btn { padding: 12px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #6eb5ff, #4a90d9); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #d94a4a); color: #fff; }
        .btn-warn { background: linear-gradient(135deg, #ffb84d, #d98a2a); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #4ade80, #22a855); color: #fff; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-full { width: 100%; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1500; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .overlay.active { opacity: 1; visibility: visible; }
        .auth-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: rgba(10, 10, 25, 0.98); border-radius: 20px; padding: 28px; color: #fff; z-index: 3000; box-shadow: 0 20px 80px rgba(0,0,0,0.9); border: 2px solid #6eb5ff; width: 90%; max-width: 380px; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .auth-modal.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .auth-modal h2 { margin-bottom: 18px; font-size: 20px; color: #6eb5ff; text-align: center; }
        .auth-modal input { width: 100%; padding: 14px 16px; margin-bottom: 12px; border-radius: 10px; background: #1a1a3e; color: #fff; border: 1px solid #444; font-size: 15px; outline: none; }
        .auth-modal input:focus { border-color: #6eb5ff; }
        .auth-modal .btn { width: 100%; margin-bottom: 10px; padding: 14px; font-size: 15px; }
        .auth-modal .switch { text-align: center; font-size: 13px; color: #888; margin-top: 10px; cursor: pointer; }
        .auth-modal .switch span { color: #6eb5ff; text-decoration: underline; }

        .hotkey-hint { position: fixed; bottom: 15px; right: 15px; background: rgba(10,10,20,0.9); padding: 8px 12px; border-radius: 10px; color: #888; font-size: 11px; z-index: 1000; display: none; }
        .hotkey-hint.allowed { display: block; }
        .hotkey-hint kbd { background: #333; padding: 2px 6px; border-radius: 5px; font-family: monospace; color: #6eb5ff; }
        .custom-marker { font-size: 32px; filter: drop-shadow(0 0 12px rgba(255,107,107,0.9)); cursor: pointer; }

        .vortex-marker { font-size: 40px; filter: drop-shadow(0 0 20px rgba(0, 200, 255, 0.9)); animation: vortexSpin 1s linear infinite; cursor: pointer; }
        .vortex-marker.tornado { filter: drop-shadow(0 0 25px rgba(255, 100, 0, 0.9)); }
        .vortex-marker.hurricane { font-size: 55px; filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.9)); }
        .vortex-marker.waterspout { filter: drop-shadow(0 0 20px rgba(0, 150, 255, 0.9)); }
        .vortex-marker.dust_devil { filter: drop-shadow(0 0 20px rgba(200, 180, 100, 0.9)); }
        @keyframes vortexSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .vortex-info { position: fixed; background: rgba(10, 10, 20, 0.95); border: 2px solid #00ccff; border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 13px; z-index: 4500; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.7); max-width: 240px; }

        .click-mode-indicator { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(255, 184, 77, 0.95); color: #000; padding: 10px 20px; border-radius: 25px; font-weight: bold; font-size: 13px; z-index: 4000; box-shadow: 0 4px 20px rgba(255,184,77,0.5); display: none; }
        .click-mode-indicator.active { display: block; }
        .connection-status { position: fixed; bottom: 15px; left: 15px; background: rgba(15, 15, 30, 0.95); padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #fff; z-index: 1000; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(100,150,255,0.2); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
        .status-dot.offline { background: #ff6b6b; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .radar-time { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(15, 15, 30, 0.95); padding: 6px 16px; border-radius: 20px; font-size: 13px; color: #6eb5ff; font-weight: bold; z-index: 1000; display: none; border: 1px solid rgba(100,150,255,0.3); }
        .radar-time.active { display: block; }

        .falling-nuke { position: fixed; top: -120px; font-size: 60px; z-index: 5000; pointer-events: none; filter: drop-shadow(0 0 20px rgba(0, 255, 0, 0.9)); transition: top 1.5s cubic-bezier(0.5, 0, 1, 1), opacity 0.3s; left: 50%; transform: translateX(-50%); opacity: 0; }
        .falling-nuke.falling { top: 50vh; opacity: 1; }
        .falling-nuke.gone { opacity: 0; }
        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0, 255, 0, 0.9) 0%, rgba(0, 100, 0, 0.4) 40%, transparent 70%); z-index: 4999; pointer-events: none; opacity: 0; }
        .flash.active { animation: flashAnim 1s ease-out; }
        @keyframes flashAnim { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
        .alert-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: rgba(5, 20, 5, 0.98); border: 3px solid #00ff00; border-radius: 20px; padding: 30px; color: #fff; z-index: 6000; box-shadow: 0 0 60px rgba(0, 255, 0, 0.8); max-width: 480px; width: 90%; opacity: 0; visibility: hidden; transition: all 0.3s ease; text-align: center; }
        .alert-box.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .alert-box h2 { color: #00ff00; margin-bottom: 15px; font-size: 22px; text-shadow: 0 0 15px rgba(0,255,0,0.7); }
        .alert-box p { font-size: 14px; line-height: 1.5; margin-bottom: 10px; color: #ddd; }
        .alert-box .warning-text { background: rgba(0, 255, 0, 0.15); padding: 12px; border-radius: 10px; font-size: 13px; color: #88ff88; margin: 15px 0; border: 1px solid #00ff00; }

        .explosion-particle { position: fixed; pointer-events: none; z-index: 4998; border-radius: 50%; animation: explodeParticle 2s ease-out forwards; }
        @keyframes explodeParticle { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
        .shockwave { position: fixed; border: 4px solid rgba(0, 255, 0, 0.8); border-radius: 50%; pointer-events: none; z-index: 4997; width: 0; height: 0; animation: shockwaveAnim 1.5s ease-out forwards; }
        @keyframes shockwaveAnim { 0% { width: 0; height: 0; opacity: 1; border-width: 8px; margin-left: 0; margin-top: 0; } 100% { width: var(--final-size); height: var(--final-size); opacity: 0; border-width: 1px; margin-left: calc(var(--final-size) / -2); margin-top: calc(var(--final-size) / -2); } }
        .radioactive-drop { position: fixed; width: 3px; height: 15px; background: linear-gradient(to bottom, transparent, #00ff00); pointer-events: none; z-index: 4996; animation: dropFall linear forwards; }
        @keyframes dropFall { 0% { top: -20px; opacity: 1; } 100% { top: 100vh; opacity: 0; } }
        .glitch-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4995; opacity: 0; mix-blend-mode: screen; }
        .glitch-overlay.active { animation: glitchAnim 0.3s steps(2) 10; }
        @keyframes glitchAnim { 0% { background: rgba(0, 255, 0, 0.15); transform: translate(0); } 25% { background: rgba(255, 0, 255, 0.15); transform: translate(-5px, 3px); } 50% { background: rgba(0, 255, 255, 0.15); transform: translate(5px, -3px); } 75% { background: rgba(255, 255, 0, 0.15); transform: translate(-3px, 5px); } 100% { background: rgba(0, 255, 0, 0.15); transform: translate(0); } }
        .radiation-indicator { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 200px; pointer-events: none; z-index: 4994; opacity: 0; filter: drop-shadow(0 0 40px #00ff00); }
        .radiation-indicator.active { animation: radiationPulse 2s ease-out; }
        @keyframes radiationPulse { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(2); } }

        @media (max-width: 600px) {
            .top-bar { top: 8px; left: 8px; right: 8px; gap: 6px; }
            .logo-badge { display: none; }
            .search-box { max-width: none; padding: 8px 14px; }
            .layers-menu { top: auto; bottom: 10px; right: 10px; left: 10px; width: auto; flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; }
            .layers-menu::-webkit-scrollbar { display: none; }
            .layer-item { flex-shrink: 0; min-width: 60px; padding: 6px 4px; }
            .weather-panel { top: 55px; left: 8px; width: calc(100% - 16px); max-width: 320px; padding: 12px; }
            .weather-panel .temp-big { font-size: 34px; }
            .admin-panel { width: 100%; max-width: 100%; padding: 20px 16px 80px 16px; border-left: none; }
            .hotkey-hint { display: none !important; }
            .connection-status { bottom: 90px; }
            .radar-time { bottom: 130px; }
        }
    </style>
</head>
