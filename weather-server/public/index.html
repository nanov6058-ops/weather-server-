<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Метео-Карта PRO</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #000; overflow: hidden; }
        #map { width: 100vw; height: 100vh; background: #0a0a1a; }

        .panel {
            position: fixed; background: rgba(10, 10, 20, 0.95);
            border-radius: 15px; padding: 20px; color: #fff;
            z-index: 1000; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(100, 150, 255, 0.3);
            backdrop-filter: blur(6px);
        }
        .panel-top-left { top: 20px; left: 20px; max-width: 320px; }
        .panel-top-right { top: 20px; right: 20px; max-width: 220px; }

        .panel h2 { margin-bottom: 15px; font-size: 18px; color: #6eb5ff; }
        .weather-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
        .weather-item:last-child { border-bottom: none; }
        .weather-value { color: #6eb5ff; font-weight: bold; }

        .map-switcher { display: flex; flex-direction: column; gap: 8px; }
        .map-btn {
            padding: 10px 14px; border: 1px solid #444; border-radius: 8px;
            background: #1a1a3e; color: #fff; font-size: 13px; font-weight: bold;
            cursor: pointer; transition: all 0.2s; text-align: left;
        }
        .map-btn:hover { background: #2a2a5e; border-color: #6eb5ff; }
        .map-btn.active { background: #6eb5ff; color: #000; border-color: #6eb5ff; }

        .admin-panel {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(5, 5, 15, 0.98);
            border-radius: 20px; padding: 30px; color: #fff;
            z-index: 2000; box-shadow: 0 20px 80px rgba(0,0,0,0.9);
            border: 2px solid #ff6b6b; width: 90%; max-width: 520px;
            max-height: 90vh; overflow-y: auto;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .admin-panel.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .admin-panel h2 { margin-bottom: 20px; font-size: 22px; color: #ff6b6b; border-bottom: 2px solid #ff6b6b; padding-bottom: 15px; }

        .admin-section { margin-bottom: 20px; }
        .admin-section h3 { font-size: 16px; color: #6eb5ff; margin-bottom: 10px; }
        .admin-control { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .admin-control label { font-size: 14px; color: #aaa; }
        .admin-control input[type="range"] { width: 100%; }
        .admin-control input[type="text"] { padding: 10px; border-radius: 8px; background: #1a1a3e; color: #fff; border: 1px solid #444; }
        .admin-control select { padding: 10px; border-radius: 8px; background: #1a1a3e; color: #fff; border: 1px solid #444; }

        .btn { padding: 12px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #6eb5ff, #4a90d9); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #d94a4a); color: #fff; }
        .btn-warn { background: linear-gradient(135deg, #ffb84d, #d98a2a); color: #fff; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

        .connection-status {
            position: fixed; top: 20px; right: 20px;
            background: rgba(10,10,20,0.95); padding: 10px 20px;
            border-radius: 10px; color: #fff; font-size: 14px;
            z-index: 1000; display: flex; align-items: center; gap: 10px;
            border: 1px solid rgba(100,150,255,0.3);
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        .hotkey-hint {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(10,10,20,0.9); padding: 10px 15px;
            border-radius: 10px; color: #888; font-size: 12px; z-index: 1000;
        }
        .hotkey-hint kbd { background: #333; padding: 3px 8px; border-radius: 5px; font-family: monospace; color: #6eb5ff; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1500;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .overlay.active { opacity: 1; visibility: visible; }

        .custom-marker {
            font-size: 32px; filter: drop-shadow(0 0 12px rgba(255,107,107,0.9));
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div class="panel panel-top-left">
    <h2>🌦️ Погода</h2>
    <div class="weather-item"><span>Температура:</span><span class="weather-value" id="tempValue">--°C</span></div>
    <div class="weather-item"><span>Ветер:</span><span class="weather-value" id="windValue">-- м/с</span></div>
    <div class="weather-item"><span>Осадки:</span><span class="weather-value" id="precipValue">-- мм</span></div>
</div>

<div class="panel panel-top-right">
    <h2>🗺️ Слои</h2>
    <div class="map-switcher">
        <button class="map-btn active" onclick="switchBaseMap('streets', this)">🛣️ Улицы</button>
        <button class="map-btn" onclick="switchBaseMap('satellite', this)">🛰️ Спутник</button>
        <button class="map-btn" onclick="toggleRadar(this)">🌧️ Осадки</button>
    </div>
</div>

<div class="connection-status">
    <div class="status-dot"></div>
    <span>Онлайн</span>
</div>

<div class="hotkey-hint"><kbd>Alt</kbd> + <kbd>U</kbd> — Админка</div>

<div class="overlay" id="overlay" onclick="closeAdmin()"></div>

<div class="admin-panel" id="adminPanel">
    <h2>🔧 Админ-панель</h2>

    <div class="admin-section">
        <h3>🌧️ Осадки</h3>
        <div class="admin-control">
            <label>Интенсивность: <span id="rainIntensityLabel">0</span>%</label>
            <input type="range" id="rainIntensity" min="0" max="100" value="0" oninput="updateRainIntensity(this.value)">
        </div>
        <div class="admin-control">
            <label>Тип явления:</label>
            <select id="phenomenonType" onchange="updatePhenomenonType(this.value)">
                <option value="rain">Дождь</option>
                <option value="snow">Снег</option>
                <option value="storm">Гроза</option>
                <option value="hurricane">Ураган</option>
                <option value="tornado">Торнадо</option>
                <option value="whirlwind">Вихрь</option>
            </select>
        </div>
    </div>

    <div class="admin-section">
        <h3>🌪️ Отправка явления</h3>
        <div class="admin-control">
            <label>Координаты (ш, д):</label>
            <input type="text" id="coordsInput" placeholder="55.7558, 37.6173" readonly>
        </div>
        <div class="admin-control">
            <label>Сила: <span id="powerLabel">3</span></label>
            <input type="range" id="power" min="1" max="10" value="3" oninput="updatePower(this.value)">
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="enableClickMode()">📍 Выбрать на карте</button>
            <button class="btn btn-warn" onclick="sendPhenomenonToCoords()">🌪️ Отправить</button>
        </div>
    </div>

    <div class="admin-section">
        <h3>💨 Ветер</h3>
        <div class="admin-control">
            <label>Скорость: <span id="windSpeedLabel">0</span> м/с</label>
            <input type="range" id="windSpeed" min="0" max="50" value="0" oninput="updateWindSpeed(this.value)">
        </div>
    </div>

    <div class="admin-section">
        <h3>🌡️ Температура</h3>
        <div class="admin-control">
            <label>Значение: <span id="tempLabel">15</span>°C</label>
            <input type="range" id="temperature" min="-50" max="50" value="15" oninput="updateTemperature(this.value)">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="applyWeather()">✅ Применить</button>
        <button class="btn btn-danger" onclick="resetWeather()">🔄 Сбросить</button>
        <button class="btn btn-danger" onclick="closeAdmin()">❌ Закрыть</button>
    </div>
</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

<script>
    // ============================================
    // КАРТА MAPTOOLKIT (без ключей, с 3D-рельефом)
    // ============================================
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://api.maptoolkit.org/styles/outdoor',
        center: [37.6173, 55.7558],
        zoom: 3,
        maxZoom: 22,
        pitch: 0,
        bearing: 0
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

    let currentBaseType = 'streets';
    let radarActive = false;
    let clickMode = false;
    let markers = [];

    let weatherState = {
        rainIntensity: 0,
        phenomenonType: 'rain',
        power: 3,
        windSpeed: 0,
        temperature: 15,
        isPrecipActive: false
    };

    // ============================================
    // АДМИНКА
    // ============================================
    document.addEventListener('keydown', (e) => {
        if (e.altKey && e.code === 'KeyU') { e.preventDefault(); openAdmin(); }
        if (e.code === 'Escape') closeAdmin();
    });

    function openAdmin() {
        document.getElementById('adminPanel').classList.add('active');
        document.getElementById('overlay').classList.add('active');
    }
    function closeAdmin() {
        document.getElementById('adminPanel').classList.remove('active');
        document.getElementById('overlay').classList.remove('active');
        clickMode = false; map.getCanvas().style.cursor = '';
    }

    function updateRainIntensity(value) {
        document.getElementById('rainIntensityLabel').textContent = value;
        weatherState.rainIntensity = parseInt(value);
        weatherState.isPrecipActive = parseInt(value) > 0;
    }
    function updatePhenomenonType(value) { weatherState.phenomenonType = value; }
    function updatePower(value) {
        document.getElementById('powerLabel').textContent = value;
        weatherState.power = parseInt(value);
    }
    function updateWindSpeed(value) {
        document.getElementById('windSpeedLabel').textContent = value;
        weatherState.windSpeed = parseInt(value);
    }
    function updateTemperature(value) {
        document.getElementById('tempLabel').textContent = value;
        weatherState.temperature = parseInt(value);
    }

    // ============================================
    // ВЫБОР МЕСТА НА КАРТЕ (ПОЧИНЕНО)
    // ============================================
    function enableClickMode() {
        clickMode = true;
        map.getCanvas().style.cursor = 'crosshair';
        console.log('📍 Режим выбора места активирован. Кликни по карте.');
    }

    // Обработчик клика — срабатывает ТОЛЬКО когда clickMode = true
    map.on('click', (e) => {
        const { lng, lat } = e.lngLat;

        if (clickMode) {
            document.getElementById('coordsInput').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            addMarker(lat, lng, weatherState.phenomenonType);
            clickMode = false;
            map.getCanvas().style.cursor = '';
            console.log('📍 Место выбрано:', lat, lng);
            return;
        }

        // Если не в режиме выбора — загружаем погоду
        loadWeather(lat, lng);
    });

    function sendPhenomenonToCoords() {
        const coordsStr = document.getElementById('coordsInput').value;
        if (!coordsStr) { alert('Сначала выбери место на карте'); return; }
        const [lat, lng] = coordsStr.split(',').map(s => parseFloat(s.trim()));
        addMarker(lat, lng, weatherState.phenomenonType);
        alert(`🌪️ ${weatherState.phenomenonType} отправлен в ${lat}, ${lng}`);
    }

    function addMarker(lat, lng, type) {
        const el = document.createElement('div');
        el.className = 'custom-marker';

        const icons = {
            rain: '🌧️', snow: '❄️', storm: '⛈️',
            hurricane: '🌀', tornado: '🌪️', whirlwind: '💨'
        };

        el.textContent = icons[type] || '🌪️';
        el.style.fontSize = `${20 + weatherState.power * 4}px`;

        const marker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
        markers.push(marker);
    }

    function clearMarkers() {
        markers.forEach(m => m.remove());
        markers = [];
    }

    function applyWeather() {
        clearMarkers();
        alert('Погода применена!');
    }

    function resetWeather() {
        weatherState = {
            rainIntensity: 0, phenomenonType: 'rain', power: 3,
            windSpeed: 0, temperature: 15, isPrecipActive: false
        };
        document.getElementById('rainIntensity').value = 0;
        document.getElementById('rainIntensityLabel').textContent = '0';
        document.getElementById('power').value = 3;
        document.getElementById('powerLabel').textContent = '3';
        document.getElementById('windSpeed').value = 0;
        document.getElementById('windSpeedLabel').textContent = '0';
        document.getElementById('temperature').value = 15;
        document.getElementById('tempLabel').textContent = '15';
        document.getElementById('coordsInput').value = '';
        clearMarkers();
    }

    // ============================================
    // ПЕРЕКЛЮЧАТЕЛЬ БАЗОВЫХ КАРТ
    // ============================================
    function switchBaseMap(type, btn) {
        if (currentBaseType === type) return;
        currentBaseType = type;

        if (map.getLayer('satellite-layer')) map.removeLayer('satellite-layer');
        if (map.getSource('satellite')) map.removeSource('satellite');

        if (type === 'satellite') {
            map.addSource('satellite', {
                type: 'raster',
                tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                tileSize: 256
            });
            map.addLayer({
                id: 'satellite-layer',
                type: 'raster',
                source: 'satellite'
            });
        }

        document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // ============================================
    // РАДАР ОСАДКОВ (RainViewer)
    // ============================================
    function toggleRadar(btn) {
        radarActive = !radarActive;

        if (radarActive) {
            fetch('https://api.rainviewer.com/public/weather-maps.json')
                .then(res => res.json())
                .then(data => {
                    const host = data.host;
                    const latest = data.radar.past[data.radar.past.length - 1];
                    const tileUrl = `${host}${latest.path}/512/{z}/{x}/{y}/2/1_1.png`;

                    map.addSource('radar-source', {
                        type: 'raster',
                        tiles: [tileUrl],
                        tileSize: 512,
                        maxzoom: 6
                    });

                    map.addLayer({
                        id: 'radar-layer',
                        type: 'raster',
                        source: 'radar-source',
                        paint: { 'raster-opacity': 0.6 }
                    });

                    btn.classList.add('active');
                    console.log('🌧️ Радар осадков включен');
                })
                .catch(err => {
                    console.error('Ошибка загрузки радара:', err);
                    alert('Не удалось загрузить радар осадков');
                    radarActive = false;
                });
        } else {
            if (map.getLayer('radar-layer')) map.removeLayer('radar-layer');
            if (map.getSource('radar-source')) map.removeSource('radar-source');
            btn.classList.remove('active');
        }
    }

    // ============================================
    // ПОГОДА (Open-Meteo)
    // ============================================
    async function loadWeather(lat, lng) {
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
            const data = await res.json();
            const w = data.current_weather;
            document.getElementById('tempValue').textContent = `${w.temperature}°C`;
            document.getElementById('windValue').textContent = `${w.windspeed} м/с`;
            document.getElementById('precipValue').textContent = `${w.precipitation || 0} мм`;
        } catch (e) {
            console.error('Ошибка погоды:', e);
        }
    }

    // ============================================
    // ЗАПУСК
    // ============================================
    map.on('load', () => {
        console.log('🗺️ Карта Maptoolkit загружена');
        loadWeather(55.7558, 37.6173);
    });
</script>

</body>
</html>
