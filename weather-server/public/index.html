<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    const map = L.map('map').setView([55.75, 37.61], 6);
    // ...
<script>
    // ============================================
    // НАСТРОЙКИ ПОДКЛЮЧЕНИЯ
    // ============================================
    
    // Замени на адрес твоего сервера после деплоя!
    const SERVER_URL = window.location.hostname === 'localhost' 
        ? 'ws://localhost:3000' 
        : 'wss://' + window.location.hostname;
    
    // ============================================
    // ИНИЦИАЛИЗАЦИЯ КАРТЫ
    // ============================================
    
    const map = L.map('map', {
        center: [55.7558, 37.6173],
        zoom: 6,
        zoomControl: false
    });
    
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
    }).addTo(map);
    
    // ============================================
    // СОСТОЯНИЕ
    // ============================================
    
    let weatherState = {
        rainIntensity: 0,
        precipType: 'rain',
        tornadoCount: 0,
        tornadoPower: 3,
        windSpeed: 0,
        temperature: 15,
        isPrecipActive: false,
        isSnowActive: false
    };
    
    let tornadoMarkers = [];
    let precipitationOverlays = [];
    let ws = null;
    let myClientId = null;
    let isAdmin = false;
    let reconnectAttempts = 0;
    
    // ============================================
    // WEBSOCKET ПОДКЛЮЧЕНИЕ
    // ============================================
    
    function connect() {
        console.log('🔌 Подключение к серверу:', SERVER_URL);
        
        ws = new WebSocket(SERVER_URL);
        
        ws.onopen = () => {
            console.log('✅ Подключено к серверу');
            reconnectAttempts = 0;
            updateConnectionStatus(true);
            
            // Запрашиваем состояние
            ws.send(JSON.stringify({ type: 'get_state' }));
        };
        
        ws.onmessage = (event) => {
            try {
                const message = JSON.parse(event.data);
                handleServerMessage(message);
            } catch (e) {
                console.error('Ошибка парсинга:', e);
            }
        };
        
        ws.onclose = () => {
            console.log('❌ Соединение закрыто');
            updateConnectionStatus(false);
            
            // Переподключение с экспоненциальной задержкой
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
            reconnectAttempts++;
            
            setTimeout(connect, delay);
        };
        
        ws.onerror = (error) => {
            console.error('Ошибка WebSocket:', error);
        };
    }
    
    function handleServerMessage(message) {
        switch (message.type) {
            case 'init':
                myClientId = message.clientId;
                weatherState = message.state;
                updateWeatherDisplay();
                applyWeatherState();
                console.log('👤 Мой ID:', myClientId);
                break;
                
            case 'state':
            case 'weather_update':
                weatherState = message.state;
                updateWeatherDisplay();
                applyWeatherState();
                break;
                
            case 'admin_changed':
                console.log('👑 Смена админа:', message);
                break;
                
            case 'user_joined':
            case 'user_left':
                updateOnlineCount(message.onlineCount);
                break;
                
            case 'error':
                showNotification('❌ ' + message.message);
                break;
        }
    }
    
    function sendWeatherUpdate() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            showNotification('❌ Нет соединения с сервером');
            return;
        }
        
        ws.send(JSON.stringify({
            type: 'weather_update',
            state: weatherState
        }));
    }
    
    // ============================================
    // АДМИН-ПАНЕЛЬ
    // ============================================
    
    document.addEventListener('keydown', function(e) {
        if (e.altKey && e.code === 'KeyU') {
            e.preventDefault();
            openAdmin();
        }
        // Escape для закрытия
        if (e.code === 'Escape') {
            closeAdmin();
        }
    });
    
    function openAdmin() {
        document.getElementById('adminPanel').classList.add('active');
        document.getElementById('overlay').classList.add('active');
        isAdmin = true;
        
        // Сообщаем серверу
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'admin_login' }));
        }
    }
    
    function closeAdmin() {
        document.getElementById('adminPanel').classList.remove('active');
        document.getElementById('overlay').classList.remove('active');
        
        if (isAdmin && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'admin_logout' }));
        }
        isAdmin = false;
    }
    
    // ============================================
    // ОБНОВЛЕНИЕ ЗНАЧЕНИЙ (в реальном времени)
    // ============================================
    
    function updateRainIntensity(value) {
        document.getElementById('rainIntensityLabel').textContent = value;
        weatherState.rainIntensity = parseInt(value);
        weatherState.isPrecipActive = parseInt(value) > 0;
        sendWeatherUpdate();
    }
    
    function updatePrecipType(value) {
        weatherState.precipType = value;
        sendWeatherUpdate();
    }
    
    function updateTornadoCount(value) {
        document.getElementById('tornadoCountLabel').textContent = value;
        weatherState.tornadoCount = parseInt(value);
        sendWeatherUpdate();
    }
    
    function updateTornadoPower(value) {
        document.getElementById('tornadoPowerLabel').textContent = value;
        weatherState.tornadoPower = parseInt(value);
        sendWeatherUpdate();
    }
    
    function updateWindSpeed(value) {
        document.getElementById('windSpeedLabel').textContent = value;
        weatherState.windSpeed = parseInt(value);
        sendWeatherUpdate();
    }
    
    function updateTemperature(value) {
        document.getElementById('tempLabel').textContent = value;
        weatherState.temperature = parseInt(value);
        sendWeatherUpdate();
    }
    
    // ============================================
    // ПРИМЕНЕНИЕ ПОГОДЫ
    // ============================================
    
    function applyWeatherState() {
        clearWeatherEffects();
        
        if (weatherState.tornadoCount > 0) {
            createTornadoes();
        }
        
        if (weatherState.isPrecipActive && weatherState.rainIntensity > 0) {
            createPrecipitation();
        }
    }
    
    function clearWeatherEffects() {
        tornadoMarkers.forEach(m => map.removeLayer(m));
        tornadoMarkers = [];
        precipitationOverlays.forEach(o => map.removeLayer(o));
        precipitationOverlays = [];
    }
    
    // ============================================
    // СОЗДАНИЕ ТОРНАДО
    // ============================================
    
    function createTornadoes() {
        const center = map.getCenter();
        
        for (let i = 0; i < weatherState.tornadoCount; i++) {
            const lat = center.lat + (Math.random() - 0.5) * 4;
            const lng = center.lng + (Math.random() - 0.5) * 6;
            
            const tornadoIcon = L.divIcon({
                className: 'tornado-overlay',
                html: `<div class="tornado-icon" style="
                    font-size: ${20 + weatherState.tornadoPower * 4}px;
                    filter: drop-shadow(0 0 ${weatherState.tornadoPower * 3}px rgba(255, 100, 100, 0.9));
                ">🌪️</div>`,
                iconSize: [50, 50],
                iconAnchor: [25, 25]
            });
            
            const marker = L.marker([lat, lng], {
                icon: tornadoIcon,
                interactive: false
            }).addTo(map);
            
            animateTornado(marker);
            tornadoMarkers.push(marker);
        }
    }
    
    function animateTornado(marker) {
        let angle = Math.random() * Math.PI * 2;
        const speed = 0.0001 * weatherState.tornadoPower;
        
        const interval = setInterval(() => {
            if (!map.hasLayer(marker)) {
                clearInterval(interval);
                return;
            }
            
            const pos = marker.getLatLng();
            angle += (Math.random() - 0.5) * 0.1;
            
            marker.setLatLng([
                pos.lat + Math.sin(angle) * speed,
                pos.lng + Math.cos(angle) * speed
            ]);
        }, 100);
    }
    
    // ============================================
    // СОЗДАНИЕ ОСАДКОВ
    // ============================================
    
    function createPrecipitation() {
        const center = map.getCenter();
        const count = Math.floor(weatherState.rainIntensity / 10) + 1;
        
        for (let i = 0; i < count; i++) {
            const lat = center.lat + (Math.random() - 0.5) * 5;
            const lng = center.lng + (Math.random() - 0.5) * 8;
            const size = 50000 + Math.random() * 100000;
            
            let color, opacity;
            
            switch(weatherState.precipType) {
                case 'snow':
                    color = 'rgba(255, 255, 255, 0.6)';
                    break;
                case 'sleet':
                    color = 'rgba(200, 220, 255, 0.5)';
                    break;
                case 'hail':
                    color = 'rgba(150, 200, 255, 0.5)';
                    break;
                default:
                    color = 'rgba(100, 150, 255, 0.4)';
            }
            
            opacity = 0.3 + weatherState.rainIntensity / 200;
            
            const circle = L.circle([lat, lng], {
                radius: size,
                color: 'transparent',
                fillColor: color,
                fillOpacity: opacity,
                interactive: false
            }).addTo(map);
            
            precipitationOverlays.push(circle);
        }
    }
    
    // ============================================
    // UI
    // ============================================
    
    function updateWeatherDisplay() {
        document.getElementById('precipValue').textContent = 
            weatherState.isPrecipActive ? weatherState.rainIntensity + '%' : '0%';
        document.getElementById('windValue').textContent = 
            weatherState.windSpeed + ' м/с';
        document.getElementById('tornadoValue').textContent = 
            weatherState.tornadoCount > 0 ? weatherState.tornadoCount + ' шт' : 'Нет';
        document.getElementById('tempValue').textContent = 
            weatherState.temperature + '°C';
        
        // Обновляем слайдеры в админке
        const rainSlider = document.getElementById('rainIntensity');
        if (rainSlider) {
            rainSlider.value = weatherState.rainIntensity;
            document.getElementById('rainIntensityLabel').textContent = weatherState.rainIntensity;
        }
        
        const tornadoSlider = document.getElementById('tornadoCount');
        if (tornadoSlider) {
            tornadoSlider.value = weatherState.tornadoCount;
            document.getElementById('tornadoCountLabel').textContent = weatherState.tornadoCount;
        }
        
        const windSlider = document.getElementById('windSpeed');
        if (windSlider) {
            windSlider.value = weatherState.windSpeed;
            document.getElementById('windSpeedLabel').textContent = weatherState.windSpeed;
        }
        
        const tempSlider = document.getElementById('temperature');
        if (tempSlider) {
            tempSlider.value = weatherState.temperature;
            document.getElementById('tempLabel').textContent = weatherState.temperature;
        }
    }
    
    function updateConnectionStatus(online) {
        const status = document.querySelector('.connection-status');
        const dot = status.querySelector('.status-dot');
        const text = status.querySelector('span');
        
        if (online) {
            dot.style.background = '#4ade80';
            text.textContent = 'Синхронизация активна';
        } else {
            dot.style.background = '#ff6b6b';
            text.textContent = 'Переподключение...';
        }
    }
    
    function updateOnlineCount(count) {
        // Можно добавить в UI
        console.log(`👥 Онлайн: ${count}`);
    }
    
    function showNotification(message) {
        const notification = document.createElement('div');
        notification.style.cssText = `
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #6eb5ff, #4a90d9);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 3000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        `;
        notification.textContent = message;
        document.body.appendChild(notification);
        
        setTimeout(() => notification.remove(), 2000);
    }
    
    function resetWeather() {
        weatherState = {
            rainIntensity: 0,
            precipType: 'rain',
            tornadoCount: 0,
            tornadoPower: 3,
            windSpeed: 0,
            temperature: 15,
            isPrecipActive: false,
            isSnowActive: false
        };
        
        sendWeatherUpdate();
        showNotification('Погода сброшена');
    }
    
    function togglePrecipitation() {
        weatherState.isPrecipActive = !weatherState.isPrecipActive;
        if (weatherState.isPrecipActive && weatherState.rainIntensity === 0) {
            weatherState.rainIntensity = 50;
        }
        sendWeatherUpdate();
    }
    
    function toggleSnow() {
        weatherState.isSnowActive = !weatherState.isSnowActive;
        if (weatherState.isSnowActive) {
            weatherState.precipType = 'snow';
            weatherState.isPrecipActive = true;
            if (weatherState.rainIntensity === 0) {
                weatherState.rainIntensity = 50;
            }
        } else {
            weatherState.precipType = 'rain';
        }
        sendWeatherUpdate();
    }
    
    // ============================================
    // ЗАПУСК
    // ============================================
    
    connect();
    updateWeatherDisplay();
    
    // Пинг каждые 30 секунд
    setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'ping' }));
        }
    }, 30000);
    
    console.log('🌦️ Метео-карта загружена');
    console.log('⌨️ Alt + U — админ-панель');
</script>
