<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Метео-Карта PRO — Weather App</title>

    <!-- MapTiler CSS -->
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.css" rel="stylesheet" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { font-family: 'Segoe UI', Arial, sans-serif; background: #000; overflow: hidden; height: 100%; width: 100%; }
        #map { width: 100vw; height: 100vh; background: #0a0a1a; }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; gap: 10px; z-index: 1000; pointer-events: none; }
        .search-box { display: flex; align-items: center; gap: 8px; background: rgba(10, 10, 20, 0.95); border-radius: 30px; padding: 8px 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.7); border: 1px solid rgba(100,150,255,0.2); pointer-events: all; flex: 1; max-width: 340px; }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; min-width: 0; }
        .search-box input::placeholder { color: #666; }
        .search-box button { background: transparent; border: none; color: #6eb5ff; font-size: 18px; cursor: pointer; padding: 0 4px; }
        .logo-badge { display: flex; align-items: center; gap: 6px; background: rgba(10, 10, 20, 0.95); border-radius: 30px; padding: 8px 18px; color: #fff; font-weight: bold; font-size: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.7); pointer-events: all; border: 1px solid rgba(100,150,255,0.2); white-space: nowrap; }
        .logo-badge span { color: #ff6b6b; }
        .user-area { margin-left: auto; display: flex; gap: 10px; pointer-events: all; }
        .user-btn { background: rgba(10, 10, 20, 0.95); border-radius: 30px; padding: 8px 18px; color: #fff; font-size: 13px; font-weight: bold; border: 1px solid rgba(100,150,255,0.2); cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,0.7); white-space: nowrap; }
        .user-btn:hover { background: rgba(20, 20, 40, 0.95); }
        .user-btn.admin-btn { border-color: #ff6b6b; color: #ff6b6b; }

        /* ПАНЕЛЬ ПОГОДЫ */
        .weather-panel { position: fixed; top: 65px; left: 10px; background: rgba(10, 10, 20, 0.95); border-radius: 18px; padding: 20px; z-index: 1000; width: 280px; box-shadow: 0 15px 50px rgba(0,0,0,0.8); border: 1px solid rgba(100,150,255,0.15); color: #fff; backdrop-filter: blur(10px); }
        .weather-panel h2 { font-size: 14px; color: #6eb5ff; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
        .weather-panel .city { font-size: 24px; font-weight: bold; margin-bottom: 4px; }
        .weather-panel .temp-big { font-size: 48px; font-weight: bold; color: #fff; margin: 8px 0; }
        .weather-panel .desc { color: #888; font-size: 14px; margin-bottom: 15px; }
        .weather-panel .details { font-size: 13px; }
        .weather-panel .details div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .weather-panel .details div:last-child { border-bottom: none; }
        .weather-panel .details .val { color: #6eb5ff; font-weight: bold; }

        /* МЕНЮ СЛОЁВ */
        .layers-menu { position: fixed; top: 65px; right: 10px; background: rgba(10, 10, 20, 0.95); border-radius: 15px; padding: 8px; z-index: 1000; width: 70px; box-shadow: 0 15px 50px rgba(0,0,0,0.8); border: 1px solid rgba(100,150,255,0.15); display: flex; flex-direction: column; gap: 6px; backdrop-filter: blur(10px); }
        .layer-item { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 12px; cursor: pointer; transition: all 0.2s; color: #fff; }
        .layer-item:hover { background: rgba(110, 181, 255, 0.15); }
        .layer-item.active { background: rgba(110, 181, 255, 0.3); }
        .layer-item .icon { font-size: 22px; margin-bottom: 2px; }
        .layer-item .label { font-size: 9px; text-align: center; color: #aaa; line-height: 1.1; }

        /* РАДАР ВРЕМЯ */
        .radar-time { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(10, 10, 20, 0.95); padding: 8px 20px; border-radius: 25px; font-size: 14px; color: #6eb5ff; font-weight: bold; z-index: 1000; display: none; border: 1px solid rgba(100,150,255,0.3); box-shadow: 0 8px 30px rgba(0,0,0,0.7); }
        .radar-time.active { display: block; }

        /* АДМИНКА */
        .admin-panel { position: fixed; top: 0; right: 0; height: 100vh; width: 360px; max-width: 95vw; background: rgba(5, 5, 15, 0.98); padding: 25px 20px; color: #fff; z-index: 2000; box-shadow: -15px 0 50px rgba(0,0,0,0.9); border-left: 2px solid #ff6b6b; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; display: none; }
        .admin-panel.allowed { display: block; }
        .admin-panel.active { transform: translateX(0); }
        .admin-panel h2 { margin-bottom: 20px; font-size: 20px; color: #ff6b6b; border-bottom: 2px solid #ff6b6b; padding-bottom: 15px; }
        .admin-section { margin-bottom: 20px; }
        .admin-section h3 { font-size: 14px; color: #6eb5ff; margin-bottom: 10px; }
        .admin-control { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .admin-control label { font-size: 13px; color: #aaa; }
        .admin-control input[type="range"] { width: 100%; height: 6px; }
        .admin-control input[type="text"] { padding: 12px; border-radius: 10px; background: #1a1a3e; color: #fff; border: 1px solid #444; font-size: 13px; }
        .admin-control select { padding: 12px; border-radius: 10px; background: #1a1a3e; color: #fff; border: 1px solid #444; font-size: 13px; }

        .btn { padding: 14px 18px; border: none; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #6eb5ff, #4a90d9); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #d94a4a); color: #fff; }
        .btn-warn { background: linear-gradient(135deg, #ffb84d, #d98a2a); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #4ade80, #22a855); color: #fff; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-full { width: 100%; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1500; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .overlay.active { opacity: 1; visibility: visible; }

        /* АВТОРИЗАЦИЯ */
        .auth-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: rgba(5, 5, 15, 0.98); border-radius: 25px; padding: 35px; color: #fff; z-index: 3000; box-shadow: 0 25px 100px rgba(0,0,0,0.9); border: 2px solid #6eb5ff; width: 90%; max-width: 400px; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .auth-modal.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .auth-modal h2 { margin-bottom: 20px; font-size: 22px; color: #6eb5ff; text-align: center; }
        .auth-modal input { width: 100%; padding: 16px 18px; margin-bottom: 14px; border-radius: 12px; background: #1a1a3e; color: #fff; border: 1px solid #444; font-size: 15px; outline: none; }
        .auth-modal input:focus { border-color: #6eb5ff; }
        .auth-modal .btn { width: 100%; margin-bottom: 12px; padding: 16px; font-size: 15px; }
        .auth-modal .switch { text-align: center; font-size: 13px; color: #888; margin-top: 12px; cursor: pointer; }
        .auth-modal .switch span { color: #6eb5ff; text-decoration: underline; }

        .hotkey-hint { position: fixed; bottom: 15px; right: 15px; background: rgba(10,10,20,0.9); padding: 10px 16px; border-radius: 12px; color: #888; font-size: 12px; z-index: 1000; display: none; }
        .hotkey-hint.allowed { display: block; }
        .hotkey-hint kbd { background: #333; padding: 3px 8px; border-radius: 6px; font-family: monospace; color: #6eb5ff; }

        .custom-marker { font-size: 36px; filter: drop-shadow(0 0 15px rgba(255,107,107,1)); cursor: pointer; }

        .click-mode-indicator { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(255, 184, 77, 0.95); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 14px; z-index: 4000; box-shadow: 0 8px 30px rgba(255,184,77,0.6); display: none; }
        .click-mode-indicator.active { display: block; }

        .connection-status { position: fixed; bottom: 15px; left: 15px; background: rgba(10, 10, 20, 0.95); padding: 8px 16px; border-radius: 25px; font-size: 12px; color: #fff; z-index: 1000; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(100,150,255,0.2); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
        .status-dot.offline { background: #ff6b6b; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        @media (max-width: 600px) {
            .top-bar { top: 8px; left: 8px; right: 8px; gap: 6px; }
            .logo-badge { display: none; }
            .search-box { max-width: none; padding: 10px 16px; }
            .layers-menu { top: auto; bottom: 10px; right: 10px; left: 10px; width: auto; flex-direction: row; overflow-x: auto; padding: 10px; gap: 5px; }
            .layers-menu::-webkit-scrollbar { display: none; }
            .layer-item { flex-shrink: 0; min-width: 65px; padding: 8px 6px; }
            .weather-panel { top: 60px; left: 8px; width: calc(100% - 16px); max-width: 340px; padding: 15px; }
            .weather-panel .temp-big { font-size: 40px; }
            .admin-panel { width: 100%; max-width: 100%; padding: 20px 16px 100px 16px; border-left: none; border-top: 2px solid #ff6b6b; }
            .hotkey-hint { display: none !important; }
            .radar-time { bottom: 100px; font-size: 12px; padding: 6px 14px; }
            .connection-status { bottom: 100px; }
        }
    </style>
</head>
<body>

<div id="map"></div>

<div class="click-mode-indicator" id="clickIndicator">📍 Кликни по карте</div>
<div class="radar-time" id="radarTime">🌧️ Радар: загрузка...</div>

<div class="top-bar">
    <div class="search-box">
        <input type="text" id="citySearch" placeholder="Поиск города...">
        <button onclick="searchCity()">🔍</button>
    </div>
    <div class="logo-badge">🌍 <span>Weather</span>PRO</div>
    <div class="user-area">
        <button class="user-btn" id="authBtn" onclick="openAuth()">Войти</button>
    </div>
</div>

<div class="layers-menu">
    <div class="layer-item active" onclick="setLayer('temp', this)"><div class="icon">🌡️</div><div class="label">Темп.</div></div>
    <div class="layer-item" onclick="toggleWindParticles(this)"><div class="icon">💨</div><div class="label">Ветер</div></div>
    <div class="layer-item" onclick="toggleRadar(this)"><div class="icon">📡</div><div class="label">Радар</div></div>
    <div class="layer-item" onclick="toggleSatellite(this)"><div class="icon">🛰️</div><div class="label">Спутник</div></div>
</div>

<div class="weather-panel">
    <h2>🌦️ Погода</h2>
    <div class="city" id="locationName">Определение...</div>
    <div class="temp-big" id="tempValue">--°C</div>
    <div class="desc" id="weatherDesc">Загрузка...</div>
    <div class="details">
        <div><span>Ветер:</span><span class="val" id="windValue">-- м/с</span></div>
        <div><span>Осадки:</span><span class="val" id="precipValue">-- мм</span></div>
        <div><span>Влажность:</span><span class="val" id="humidityValue">-- %</span></div>
    </div>
</div>

<div class="hotkey-hint" id="hotkeyHint"><kbd>Alt</kbd> + <kbd>U</kbd> — Админка</div>

<div class="connection-status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Подключение...</span>
</div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="admin-panel" id="adminPanel">
    <h2>🔧 Админ-панель</h2>

    <div class="admin-section">
        <h3>🌧️ Тип осадков</h3>
        <div class="admin-control">
            <label>Выбор типа:</label>
            <select id="precipType" onchange="onPrecipTypeChange(this.value)">
                <option value="rain">🌧️ Дождь (синий)</option>
                <option value="snow">❄️ Снег (белый)</option>
                <option value="storm">⛈️ Гроза (фиолетовый)</option>
                <option value="hail">🧊 Град (красный)</option>
                <option value="sleet">🌨️ Мокрый снег (голубой)</option>
                <option value="hurricane">🌀 Ураган (оранжевый)</option>
            </select>
        </div>
    </div>

    <div class="admin-section">
        <h3>🌪️ Отправка явления</h3>
        <div class="admin-control">
            <label>Координаты:</label>
            <input type="text" id="coordsInput" placeholder="Нажми 'Выбрать на карте'" readonly>
        </div>
        <div class="admin-control">
            <label>Сила: <span id="powerLabel">3</span></label>
            <input type="range" id="power" min="1" max="10" value="3" oninput="document.getElementById('powerLabel').textContent=this.value">
        </div>
        <div class="btn-group">
            <button class="btn btn-primary btn-full" id="pickBtn" onclick="enableClickMode()">📍 Выбрать на карте</button>
            <button class="btn btn-warn btn-full" onclick="sendPhenomenonToCoords()">🌪️ Отправить</button>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-success btn-full" onclick="applyWeather()">✅ Применить для всех</button>
        <button class="btn btn-danger btn-full" onclick="resetWeather()">🔄 Сбросить у всех</button>
        <button class="btn btn-danger btn-full" onclick="closeAll()">❌ Закрыть</button>
    </div>
</div>

<div class="auth-modal" id="authModal">
    <h2 id="authTitle">Вход</h2>
    <input type="text" id="authLogin" placeholder="Логин">
    <input type="password" id="authPassword" placeholder="Пароль">
    <button class="btn btn-primary" id="authSubmit" onclick="submitAuth()">Войти</button>
    <div class="switch" id="authSwitch">Нет аккаунта? <span onclick="toggleAuthMode()">Зарегистрироваться</span></div>
</div>

<!-- MAPTILER SDK -->
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.js"></script>
<script src="https://cdn.maptiler.com/maptiler-weather/v3.0.0/maptiler-weather.js"></script>

<script>
    // ============================================
    // НАСТРОЙКИ
    // ============================================
    const MAPTILER_KEY = 'fmeyxDoUo8sqbqe6CoQQ';
    maptilersdk.config.apiKey = MAPTILER_KEY;

    // ============================================
    // КАРТА MAPTILER
    // ============================================
    const map = new maptilersdk.Map({
        container: 'map',
        style: maptilersdk.MapStyle.BACKDROP,
        center: [142.738, 46.959],
        zoom: 5,
        projection: 'mercator'
    });

    let radarActive = false;
    let satelliteActive = false;
    let windParticlesActive = false;
    let clickMode = false;
    let markers = [];
    let authMode = 'login';
    let ws = null;
    let radarFrames = [];
    let radarFrameIndex = 0;
    let radarAnimationTimer = null;
    let radarHost = '';
    let windLayer = null;

    // ============================================
    // АДМИН-ДОСТУП
    // ============================================
    const ADMIN_LOGIN = 'weather';
    function isAdmin() { return localStorage.getItem('login') === ADMIN_LOGIN; }

    function updateAdminVisibility() {
        const admin = isAdmin();
        document.getElementById('adminPanel').classList.toggle('allowed', admin);
        document.getElementById('hotkeyHint').classList.toggle('allowed', admin);
    }

    // ============================================
    // WEBSOCKET
    // ============================================
    const SERVER_URL = 'wss://' + window.location.host;
    let weatherState = { rainIntensity: 0, phenomenonType: 'rain', precipColor: 4, power: 3, windSpeed: 0, temperature: 15, isPrecipActive: false, tornadoCount: 0, lastLat: null, lastLng: null };

    function connectWS() {
        ws = new WebSocket(SERVER_URL);
        ws.onopen = () => { document.getElementById('statusDot').classList.remove('offline'); document.getElementById('statusText').textContent = 'Онлайн'; ws.send(JSON.stringify({ type: 'get_state' })); };
        ws.onmessage = (event) => { try { const msg = JSON.parse(event.data); if (msg.type === 'init' || msg.type === 'state' || msg.type === 'weather_update') { weatherState = msg.state; applyWeatherFromServer(); } } catch (e) {} };
        ws.onclose = () => { document.getElementById('statusDot').classList.add('offline'); document.getElementById('statusText').textContent = 'Переподключение...'; setTimeout(connectWS, 3000); };
    }

    function sendWeatherToServer() { if (!isAdmin() || !ws || ws.readyState !== WebSocket.OPEN) return; ws.send(JSON.stringify({ type: 'weather_update', state: weatherState })); }

    function applyWeatherFromServer() {
        if (weatherState.isPrecipActive) document.getElementById('precipValue').textContent = weatherState.rainIntensity + '%';
        if (weatherState.windSpeed > 0) document.getElementById('windValue').textContent = weatherState.windSpeed + ' м/с';
        if (weatherState.temperature !== 15) document.getElementById('tempValue').textContent = weatherState.temperature + '°C';
        if (radarActive && radarFrames.length > 0) { const frame = radarFrames[radarFrameIndex]; const source = map.getSource('radar-source'); if (source) source.setTiles([`${radarHost}${frame.path}/512/{z}/{x}/{y}/${weatherState.precipColor || 4}/1_1.png`]); }
        if (weatherState.lastLat && weatherState.lastLng) { const icons = { rain: '🌧️', snow: '❄️', storm: '⛈️', hurricane: '🌀', tornado: '🌪️', whirlwind: '💨' }; const el = document.createElement('div'); el.className = 'custom-marker'; el.textContent = icons[weatherState.phenomenonType] || '🌪️'; el.style.fontSize = (20 + weatherState.power * 4) + 'px'; markers.push(new maptilersdk.Marker({ element: el }).setLngLat([weatherState.lastLng, weatherState.lastLat]).addTo(map)); }
    }

    connectWS();

    // ============================================
    // АВТОРИЗАЦИЯ
    // ============================================
    const API_URL = window.location.origin;
    function openAuth() { document.getElementById('authModal').classList.add('active'); document.getElementById('overlay').classList.add('active'); }
    function closeAuth() { document.getElementById('authModal').classList.remove('active'); if (!document.getElementById('adminPanel').classList.contains('active')) document.getElementById('overlay').classList.remove('active'); }
    function toggleAuthMode() { authMode = authMode === 'login' ? 'register' : 'login'; document.getElementById('authTitle').textContent = authMode === 'login' ? 'Вход' : 'Регистрация'; document.getElementById('authSubmit').textContent = authMode === 'login' ? 'Войти' : 'Зарегистрироваться'; document.getElementById('authSwitch').innerHTML = authMode === 'login' ? 'Нет аккаунта? <span onclick="toggleAuthMode()">Зарегистрироваться</span>' : 'Уже есть аккаунт? <span onclick="toggleAuthMode()">Войти</span>'; }

    async function submitAuth() { const login = document.getElementById('authLogin').value.trim(); const password = document.getElementById('authPassword').value.trim(); if (!login || !password) return; try { const res = await fetch(API_URL + (authMode === 'register' ? '/api/register' : '/api/login'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login, password }) }); const data = await res.json(); if (!res.ok) { alert('❌ ' + (data.error || 'Ошибка')); return; } localStorage.setItem('token', data.token); localStorage.setItem('login', data.login); updateUserUI(data.login); updateAdminVisibility(); closeAuth(); alert('✅ Добро пожаловать!'); } catch (e) { alert('❌ Ошибка соединения'); } }

    function updateUserUI(login) { const btn = document.getElementById('authBtn'); btn.textContent = login + ' (выйти)'; btn.onclick = logout; btn.classList.toggle('admin-btn', login === ADMIN_LOGIN); if (login === ADMIN_LOGIN) btn.textContent = '👑 ' + login + ' (выйти)'; }
    function logout() { localStorage.removeItem('token'); localStorage.removeItem('login'); document.getElementById('authBtn').textContent = 'Войти'; document.getElementById('authBtn').onclick = openAuth; document.getElementById('authBtn').classList.remove('admin-btn'); updateAdminVisibility(); closeAll(); }

    window.addEventListener('load', async () => { const token = localStorage.getItem('token'); const login = localStorage.getItem('login'); if (token && login) { try { const res = await fetch(API_URL + '/api/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) }); const data = await res.json(); if (data.success) { updateUserUI(data.login); updateAdminVisibility(); } else { localStorage.removeItem('token'); localStorage.removeItem('login'); } } catch (e) {} } });

    // ============================================
    // АДМИНКА — ALT+U
    // ============================================
    document.addEventListener('keydown', (e) => { if (e.altKey && e.code === 'KeyU') { e.preventDefault(); if (!isAdmin()) return; const panel = document.getElementById('adminPanel'); panel.classList.toggle('active'); document.getElementById('overlay').classList.toggle('active', panel.classList.contains('active')); } if (e.code === 'Escape') closeAll(); });

    function closeAll() { document.getElementById('adminPanel').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); closeAuth(); clickMode = false; map.getCanvas().style.cursor = ''; document.getElementById('clickIndicator').classList.remove('active'); document.getElementById('pickBtn').textContent = '📍 Выбрать на карте'; }

    // ============================================
    // ПОИСК
    // ============================================
    async function searchCity() {
        const query = document.getElementById('citySearch').value.trim();
        if (!query) return;
        try {
            const res = await maptilersdk.geocoding.forward(query, { limit: 1 });
            if (res.features.length > 0) {
                const [lng, lat] = res.features[0].center;
                map.flyTo({ center: [lng, lat], zoom: 10 });
                loadWeather(lat, lng);
                getLocationName(lat, lng);
            } else { alert('Город не найден'); }
        } catch (e) { console.error(e); }
    }
    document.getElementById('citySearch').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchCity(); });

    // ============================================
    // СЛОИ
    // ============================================
    function setLayer(layerType, btn) { document.querySelectorAll('.layer-item').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }

    // ТИП ОСАДКОВ
    function onPrecipTypeChange(type) {
        const colorMap = { rain: 4, snow: 6, storm: 3, hail: 5, sleet: 2, hurricane: 7 };
        weatherState.precipColor = colorMap[type] || 4;
        weatherState.phenomenonType = type === 'hail' ? 'storm' : type;
        if (radarActive && radarFrames.length > 0) { const frame = radarFrames[radarFrameIndex]; const source = map.getSource('radar-source'); if (source) source.setTiles([`${radarHost}${frame.path}/512/{z}/{x}/{y}/${weatherState.precipColor}/1_1.png`]); }
        if (isAdmin()) sendWeatherToServer();
    }

    // ЧАСТИЦЫ ВЕТРА MAPTILER
    function toggleWindParticles(btn) {
        windParticlesActive = !windParticlesActive;
        if (windParticlesActive) {
            try {
                windLayer = new maptilerweather.WindLayer();
                map.addLayer(windLayer, 'Water');
                windLayer.animateByFactor(3600);
                btn.classList.add('active');
                console.log('💨 Частицы ветра включены');
            } catch (e) {
                console.error('Ошибка частиц:', e);
                alert('Не удалось загрузить частицы ветра');
                windParticlesActive = false;
            }
        } else {
            if (windLayer) { map.removeLayer(windLayer.id); windLayer = null; }
            btn.classList.remove('active');
            console.log('💨 Частицы ветра выключены');
        }
    }

    // РАДАР
    function toggleRadar(btn) {
        radarActive = !radarActive;
        if (radarActive) {
            fetch('https://api.rainviewer.com/public/weather-maps.json').then(r => r.json()).then(data => {
                radarHost = data.host;
                radarFrames = [...data.radar.past, ...(data.radar.nowcast || [])];
                if (radarFrames.length === 0) { radarActive = false; return; }
                const firstFrame = radarFrames[0];
                if (map.getSource('radar-source')) map.removeSource('radar-source');
                if (map.getLayer('radar-layer')) map.removeLayer('radar-layer');
                map.addSource('radar-source', { type: 'raster', tiles: [`${radarHost}${firstFrame.path}/512/{z}/{x}/{y}/${weatherState.precipColor || 4}/1_1.png`], tileSize: 512, maxzoom: 7 });
                map.addLayer({ id: 'radar-layer', type: 'raster', source: 'radar-source', paint: { 'raster-opacity': 0.75, 'raster-fade-duration': 0 } });
                btn.classList.add('active');
                document.getElementById('radarTime').classList.add('active');
                startRadarAnimation();
            });
        } else {
            if (radarAnimationTimer) clearInterval(radarAnimationTimer);
            if (map.getLayer('radar-layer')) map.removeLayer('radar-layer');
            if (map.getSource('radar-source')) map.removeSource('radar-source');
            document.getElementById('radarTime').classList.remove('active');
            btn.classList.remove('active');
        }
    }

    function startRadarAnimation() {
        if (radarAnimationTimer) clearInterval(radarAnimationTimer);
        radarFrameIndex = 0;
        radarAnimationTimer = setInterval(() => {
            if (!radarActive || radarFrames.length === 0) return;
            radarFrameIndex = (radarFrameIndex + 1) % radarFrames.length;
            const frame = radarFrames[radarFrameIndex];
            const source = map.getSource('radar-source');
            if (source) source.setTiles([`${radarHost}${frame.path}/512/{z}/{x}/{y}/${weatherState.precipColor || 4}/1_1.png`]);
            const time = new Date(frame.time * 1000);
            const timeStr = time.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const isForecast = radarFrameIndex >= radarFrames.length - (radarFrames.length / 3);
            document.getElementById('radarTime').textContent = `🌧️ ${isForecast ? 'Прогноз' : 'Радар'}: ${timeStr}`;
        }, 500);
    }

    // СПУТНИК
    function toggleSatellite(btn) {
        satelliteActive = !satelliteActive;
        if (satelliteActive) {
            map.addSource('satellite-source', { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256 });
            map.addLayer({ id: 'satellite-layer', type: 'raster', source: 'satellite-source', paint: { 'raster-opacity': 1 } });
            btn.classList.add('active');
        } else {
            if (map.getLayer('satellite-layer')) map.removeLayer('satellite-layer');
            if (map.getSource('satellite-source')) map.removeSource('satellite-source');
            btn.classList.remove('active');
        }
    }

    // ============================================
    // КЛИК ПО КАРТЕ
    // ============================================
    map.on('click', (e) => {
        if (clickMode) {
            const { lng, lat } = e.lngLat;
            document.getElementById('coordsInput').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            const el = document.createElement('div'); el.className = 'custom-marker'; el.textContent = '📍';
            const marker = new maptilersdk.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
            markers.push(marker);
            clickMode = false;
            map.getCanvas().style.cursor = '';
            document.getElementById('clickIndicator').classList.remove('active');
            document.getElementById('pickBtn').textContent = '📍 Выбрать на карте';
            return;
        }
        loadWeather(e.lngLat.lat, e.lngLat.lng);
        getLocationName(e.lngLat.lat, e.lngLat.lng);
    });

    function enableClickMode() {
        if (!isAdmin()) return;
        clickMode = true;
        map.getCanvas().style.cursor = 'crosshair';
        document.getElementById('clickIndicator').classList.add('active');
        document.getElementById('pickBtn').textContent = '⏳ Кликни по карте...';
    }

    function sendPhenomenonToCoords() {
        if (!isAdmin()) return;
        const coordsStr = document.getElementById('coordsInput').value;
        if (!coordsStr) { alert('Сначала выбери место на карте'); return; }
        const [lat, lng] = coordsStr.split(',').map(s => parseFloat(s.trim()));
        const type = document.getElementById('precipType').value;
        const power = parseInt(document.getElementById('power').value);
        weatherState.phenomenonType = type;
        weatherState.power = power;
        weatherState.lastLat = lat;
        weatherState.lastLng = lng;
        weatherState.tornadoCount = (weatherState.tornadoCount || 0) + 1;
        sendWeatherToServer();
        applyWeatherFromServer();
        alert(`✅ ${type} отправлен ВСЕМ в ${lat}, ${lng}`);
    }

    function applyWeather() { if (!isAdmin()) return; sendWeatherToServer(); alert('✅ Погода отправлена ВСЕМ!'); }
    function resetWeather() { if (!isAdmin()) return; weatherState = { rainIntensity: 0, phenomenonType: 'rain', precipColor: 4, power: 3, windSpeed: 0, temperature: 15, isPrecipActive: false, tornadoCount: 0, lastLat: null, lastLng: null }; markers.forEach(m => m.remove()); markers = []; sendWeatherToServer(); alert('🔄 Сброшено для ВСЕХ'); }

    // ============================================
    // ПОГОДА
    // ============================================
    async function loadWeather(lat, lng) {
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&hourly=relativehumidity_2m`);
            const data = await res.json();
            const w = data.current_weather;
            document.getElementById('tempValue').textContent = `${Math.round(w.temperature)}°C`;
            document.getElementById('windValue').textContent = `${w.windspeed} м/с`;
            document.getElementById('precipValue').textContent = `${w.precipitation || 0} мм`;
            document.getElementById('weatherDesc').textContent = getWeatherDesc(w.weathercode);
            if (data.hourly && data.hourly.relativehumidity_2m) document.getElementById('humidityValue').textContent = `${data.hourly.relativehumidity_2m[0]}%`;
        } catch (e) { console.error(e); }
    }

    function getWeatherDesc(code) {
        const codes = { 0: 'Ясно', 1: 'Преимущественно ясно', 2: 'Переменная облачность', 3: 'Пасмурно', 45: 'Туман', 48: 'Туман с изморозью', 51: 'Лёгкая морось', 53: 'Морось', 55: 'Сильная морось', 61: 'Небольшой дождь', 63: 'Дождь', 65: 'Сильный дождь', 71: 'Небольшой снег', 73: 'Снег', 75: 'Сильный снег', 80: 'Ливень', 95: 'Гроза', 96: 'Гроза с градом', 99: 'Сильная гроза с градом' };
        return codes[code] || 'Неизвестно';
    }

    async function getLocationName(lat, lng) {
        try {
            const res = await maptilersdk.geocoding.reverse([lng, lat]);
            if (res.features.length > 0) {
                const place = res.features[0].place_name_ru || res.features[0].place_name;
                document.getElementById('locationName').textContent = place.split(',')[0];
            }
        } catch (e) { document.getElementById('locationName').textContent = 'Локация'; }
    }

    function autoDetectLocation() {
        if (!navigator.geolocation) { loadWeather(46.959, 142.738); getLocationName(46.959, 142.738); return; }
        navigator.geolocation.getCurrentPosition(
            (position) => { const lat = position.coords.latitude; const lng = position.coords.longitude; map.flyTo({ center: [lng, lat], zoom: 10 }); loadWeather(lat, lng); getLocationName(lat, lng); },
            () => { loadWeather(46.959, 142.738); getLocationName(46.959, 142.738); },
            { timeout: 5000 }
        );
    }

    map.on('load', () => {
        console.log('🗺️ Карта MapTiler готова');
        updateAdminVisibility();
        autoDetectLocation();
        // Автоматически включаем частицы ветра
        setTimeout(() => {
            const windBtn = document.querySelector('.layer-item[onclick*="toggleWindParticles"]');
            if (windBtn && !windParticlesActive) toggleWindParticles(windBtn);
        }, 2000);
    });
</script>

</body>
</html>
